<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>लॉगिन - NS Jewellers</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #f9f6f0; padding-bottom: 80px; }
        
        .app-header { background-color: #fdfbf7; padding: 15px; border-bottom: 1px solid #e0d8c5; text-align: center; }
        .shop-name { font-size: 20px; font-weight: bold; color: #b8860b; }
        
        /* सेंटर में लॉगिन और प्रोफाइल बॉक्स */
        .login-container { 
            max-width: 400px; 
            margin: 40px auto; 
            background: white; 
            padding: 25px; 
            border-radius: 12px; 
            border: 1px solid #e0d8c5; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
            text-align: center; 
        }
        
        /* प्रोफाइल और अवतार स्टाइल */
        .user-avatar {
            width: 75px;
            height: 75px;
            border-radius: 50%;
            border: 2px solid #b8860b;
            object-fit: cover;
            background-color: #f4efe6;
            margin-bottom: 10px;
        }
        .profile-info { text-align: left; margin: 15px 0; background: #fffaf0; padding: 12px; border-radius: 8px; border: 1px solid #e0d8c5; font-size: 14px; color: #444; }
        .profile-info p { margin-bottom: 6px; }

        .login-container h2 { color: #b8860b; margin-bottom: 15px; }
        .login-container p { color: #666; font-size: 14px; margin-bottom: 15px; }
        
        .input-box { width: 100%; padding: 11px; margin-bottom: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; text-align: center; }
        .login-btn { width: 100%; padding: 11px; background: #b8860b; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 15px; cursor: pointer; }
        .login-btn:hover { background: #996d08; }
        
        .logout-btn { background: #d9534f; margin-top: 10px; }
        .logout-btn:hover { background: #c9302c; }

        /* नया अकाउंट बनाने के लिए नीला लिंक */
        .create-link { display: inline-block; margin-top: 15px; color: #0066cc; text-decoration: none; font-size: 14px; font-weight: 500; }
        .create-link:hover { text-decoration: underline; }

        /* बॉटम नेविगेशन बार */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #fdfbf7;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #e0d8c5;
            z-index: 1000;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #555; font-size: 12px; }
        .nav-icon { font-size: 18px; margin-bottom: 2px; }
        .nav-avatar { width: 22px; height: 22px; border-radius: 50%; border: 1px solid #b8860b; object-fit: cover; margin-bottom: 2px; }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="shop-name">NS Jewellers 💍</div>
    </header>

    <div class="login-container" id="loginBox">
        <!-- जावास्क्रिप्ट द्वारा यहाँ फॉर्म या प्रोफाइल लोड होगी -->
    </div>

    <!-- बॉटम नेविगेशन बार -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item"><span class="nav-icon">🏠</span>होम</a>
        <a href="productlist.html" class="nav-item"><span class="nav-icon">💍</span>सूची</a>
        <a href="history.html" class="nav-item"><span class="nav-icon">📜</span>इतिहास</a>
        <a href="login.html" class="nav-item" style="color: #b8860b;" id="navLoginItem"><span class="nav-icon">👤</span>लॉगिन</a>
    </nav>

    <script>
        const loginBox = document.getElementById('loginBox');
        const navLoginItem = document.getElementById('navLoginItem');
        
        // लोकल स्टोरेज से डेटा निकालना
        const savedNumber = localStorage.getItem('userNumber');
        const savedName = localStorage.getItem('userName');
        const savedFather = localStorage.getItem('userFather');
        const savedAddress = localStorage.getItem('userAddress');
        const savedAvatar = localStorage.getItem('userAvatar');

        // अगर ग्राहक पहले से लॉगिन है
        if (savedNumber) {
            loginBox.innerHTML = `
                <img src="${savedAvatar || 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + savedNumber}" alt="Avatar" class="user-avatar">
                <h2>मेरी प्रोफाइल ✨</h2>
                <div class="profile-info">
                    <p>👤 <strong>नाम:</strong> ${savedName || 'ग्राहक'}</p>
                    <p>👨‍👦 <strong>पिता का नाम:</strong> ${savedFather || 'उपलब्ध नहीं'}</p>
                    <p>📞 <strong>मोबाइल नंबर:</strong> ${savedNumber}</p>
                    <p>🏠 <strong>पता:</strong> ${savedAddress || 'उपलब्ध नहीं'}</p>
                </div>
                <p style="color: #2e7d32; font-weight: 500; font-size: 13px;">खाता सक्रिय है ✅</p>
                <button class="login-btn logout-btn" onclick="handleLogout()">लॉग आउट करें 🚪</button>
            `;

            navLoginItem.innerHTML = `
                <img src="${savedAvatar || 'https://api.dicebear.com/7.x/avataaars/svg?seed=' + savedNumber}" alt="Profile" class="nav-avatar">
                <span>प्रोफाइल</span>
            `;
        } else {
            // यदि लॉगिन नहीं है, तो लॉगिन फॉर्म दिखाएं
            loginBox.innerHTML = `
                <h2>ग्राहक लॉगिन 👤</h2>
                <p>लॉगिन करने के लिए विवरण दर्ज करें</p>
                <input type="text" id="loginIdentifier" class="input-box" placeholder="मोबाइल नंबर या नाम दर्ज करें">
                <input type="password" id="loginPin" class="input-box" placeholder="पिन कोड (PIN Code) दर्ज करें" maxlength="6">
                <button class="login-btn" onclick="handleLogin()">लॉगिन करें</button>
                <br>
                <!-- आपके गूगल फॉर्म का लिंक यहाँ जोड़ा गया है -->
                <a href="https://forms.gle/WACZ1GRbGM8STBZL7" target="_blank" class="create-link">नया अकाउंट बनाएं? यहाँ क्लिक करें 📝</a>
            `;

            navLoginItem.innerHTML = `<span class="nav-icon">👤</span>लॉगिन`;
        }

        function handleLogin() {
            const identifier = document.getElementById('loginIdentifier').value.trim();
            const pin = document.getElementById('loginPin').value.trim();

            if (!identifier || pin.length < 4) {
                alert('कृपया सही मोबाइल नंबर/नाम और पिन कोड दर्ज करें ⚠️');
                return;
            }

            // डेमो के लिए डेटा सेट किया गया है (आप इसे अपनी गूगल शीट से भी जोड़ सकते हैं)
            const customerName = identifier.length === 10 ? "NS Jewellers Cutomer" : identifier;
            const fatherName = "राजेश कुमार";
            const address = "मुख्य बाजार, नागौर, राजस्थान";
            const mobileNumber = identifier.length === 10 ? identifier : "9876543210";
            const aiAvatar = `https://api.dicebear.com/7.x/avataaars/svg?seed=${mobileNumber}`;

            // ब्राउज़र में हमेशा के लिए डेटा सेव करना
            localStorage.setItem('userNumber', mobileNumber);
            localStorage.setItem('userName', customerName);
            localStorage.setItem('userFather', fatherName);
            localStorage.setItem('userAddress', address);
            localStorage.setItem('userAvatar', aiAvatar);

            alert('लॉगिन सफल रहा! 🎉');
            window.location.reload();
        }

        function handleLogout() {
            localStorage.clear(); // सभी डेटा हटाना
            alert('आप सफलतापूर्वक लॉग आउट हो गए हैं! 👋');
            window.location.reload();
        }
    </script>
</body>
</html>
