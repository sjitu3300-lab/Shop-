<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>NS Jewellers - रजिस्ट्रेशन</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f9f6f0; padding: 20px; }
        .card { background: #fff; padding: 20px; border-radius: 10px; border: 1px solid #e0d8c5; max-width: 400px; margin: auto; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .form-input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .action-btn { width: 100%; background: #b8860b; color: white; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; }
        h2 { color: #b8860b; text-align: center; }
    </style>
</head>
<body>

<div class="card">
    <h2>NS Jewellers 💍</h2>
    <p style="text-align: center;">अपना विवरण भरें</p>
    
    <!-- यहाँ आप अपने Google Form का लिंक लगा सकते हैं, 
         लेकिन अगर आप इसे सीधे इसी पेज पर भरना चाहते हैं, तो नीचे का फॉर्म उपयोग करें -->
    
    <input type="text" id="name" class="form-input" placeholder="आपका पूरा नाम">
    <input type="text" id="fatherName" class="form-input" placeholder="पिता का नाम">
    <input type="tel" id="mobile" class="form-input" placeholder="मोबाइल नंबर" maxlength="10">
    <input type="text" id="address" class="form-input" placeholder="पूरा पता">
    
    <button class="action-btn" onclick="saveData()">डेटा सबमिट करें</button>
</div>

<script>
    function saveData() {
        const name = document.getElementById('name').value;
        const father = document.getElementById('fatherName').value;
        const mobile = document.getElementById('mobile').value;
        const address = document.getElementById('address').value;

        if(!name || !mobile) {
            alert("कृपया नाम और मोबाइल नंबर भरें!");
            return;
        }

        // यह डेटा आपके ब्राउज़र में सेव हो रहा है।
        // भविष्य में हम इसे Google Sheet से जोड़ देंगे।
        const userData = { name, father, mobile, address };
        localStorage.setItem(mobile, JSON.stringify(userData));
        
        alert("सफलतापूर्वक सबमिट हो गया! हम जल्द ही आपसे संपर्क करेंगे।");
        location.reload();
    }
</script>

</body>
</html>
