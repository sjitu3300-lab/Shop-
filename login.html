<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>लॉगिन - NS Jewellers</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #f9f6f0; padding-bottom: 80px; }
        
        /* हेडर स्टाइल */
        .app-header { background-color: #fdfbf7; padding: 15px; border-bottom: 1px solid #e0d8c5; text-align: center; }
        .shop-name { font-size: 20px; font-weight: bold; color: #b8860b; }
        
        /* सेंटर में लॉगिन और प्रोफाइल बॉक्स */
        .login-container { 
            max-width: 400px; 
            margin: 60px auto; 
            background: white; 
            padding: 30px; 
            border-radius: 12px; 
            border: 1px solid #e0d8c5; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.05); 
            text-align: center; 
        }
        
        /* AI अवतार और आईडी बैज */
        .avatar-container { margin-bottom: 20px; }
        .user-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            border: 2px solid #b8860b;
            object-fit: cover;
            background-color: #f4efe6;
        }
        .id-badge {
            display: inline-block;
            background: #fffaf0;
            color: #b8860b;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            border: 1px solid #e0d8c5;
            margin-top: 10px;
        }

        .login-container h2 { color: #b8860b; margin-bottom: 15px; }
        .login-container p { color: #666; font-size: 14px; margin-bottom: 20px; }
        
        .input-box { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; text-align: center; }
        .login-btn { width: 100%; padding: 12px; background: #b8860b; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .login-btn:hover { background: #996d08; }
        
        .logout-btn { background: #d9534f; margin-top: 10px; }
        .logout-btn:hover { background: #c9302c; }

        /* फिक्स्ड बॉटम नेविगेशन बार */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #fdfbf7;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #e0d8c5;
            z-index: 1000;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #555; font-size: 12px; }
        .nav-icon { font-size: 18px; margin-bottom: 2px; }
        
        /* बॉटम नेविगेशन के लिए छोटा AI अवतार */
        .nav-avatar {
            width: 22px;
            height: 22px;
            border-radius: 50%;
            border: 1px solid #b8860b;
            object-fit: cover;
            margin-bottom: 2px;
        }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="shop-name">NS Jewellers 💍</div>
    </header>

    <!-- सेंटर में दिखने वाला बॉक्स -->
    <div class="login-container" id="loginBox">
        <!-- जावास्क्रिप्ट द्वारा यहाँ लॉगिन फॉर्म या प्रोफाइल लोड होगी -->
    </div>

    <!-- बॉटम नेविगेशन बार -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <span class="nav-icon">🏠</span>होम
        </a>
        <a href="productlist.html" class="nav-item">
            <span class="nav-icon">💍</span>सूची
        </a>
        <a href="history.html" class="nav-item">
            <span class="nav-icon">📜</span>इतिहास
        </a>
        <!-- डायनेमिक नेविगेशन लॉगिन/अवतार आइकन -->
        <a href="login.html" class="nav-item" style="color: #b8860b;" id="navLoginItem">
            <span class="nav-icon">👤</span>लॉगिन
        </a>
    </nav>

    <script>
        const loginBox = document.getElementById('loginBox');
        const navLoginItem = document.getElementById('navLoginItem');
        
        const savedNumber = localStorage.getItem('userNumber');
        const savedId = localStorage.getItem('customerId');
        const savedAvatar = localStorage.getItem('userAvatar');

        // जांचें कि क्या ग्राहक पहले से लॉगिन है
        if (savedNumber && savedId) {
            // 1. यदि लॉगिन है, तो सेंटर में उसकी प्रोफाइल, आईडी और लॉग आउट बटन दिखाएं
            loginBox.innerHTML = `
                <div class="avatar-container">
                    <img src="${savedAvatar}" alt="AI Avatar" class="user-avatar">
                    <div><span class="id-badge">🆔 ${savedId}</span></div>
                </div>
                <h2>स्वागत है! ✨</h2>
                <p>मोबाइल नंबर: <strong>${savedNumber}</strong></p>
                <p style="color: #2e7d32; font-weight: 500; margin-bottom: 15px;">आपका खाता सक्रिय है ✅</p>
                <button class="login-btn logout-btn" onclick="handleLogout()">लॉग आउट करें 🚪</button>
            `;

            // 2. बॉटम नेविगेशन में सामान्य 'लॉगिन' टेक्स्ट की जगह उसका AI अवतार सेट करें
            navLoginItem.innerHTML = `
                <img src="${savedAvatar}" alt="Profile" class="nav-avatar">
                <span>प्रोफाइल</span>
            `;
        } else {
            // यदि लॉगिन नहीं है, तो सेंटर में पुराना लॉगिन फॉर्म और बॉटम में सामान्य आइकन दिखाएं
            loginBox.innerHTML = `
                <h2>ग्राहक खाता 👤</h2>
                <p>खाता बनाने या लॉगिन करने के लिए मोबाइल नंबर दर्ज करें</p>
                <input type="tel" id="mobileNumber" class="input-box" placeholder="मोबाइल नंबर (10 अंक)" maxlength="10">
                <button class="login-btn" onclick="handleLogin()">खाता बनाएं / लॉगिन करें</button>
            `;

            navLoginItem.innerHTML = `
                <span class="nav-icon">👤</span>लॉगिन
            `;
        }

        // लॉगिन और अकाउंट क्रिएट करने का फंक्शन
        function handleLogin() {
            const number = document.getElementById('mobileNumber').value.trim();

            if (number.length !== 10 || isNaN(number)) {
                alert('कृपया वैध 10 अंकों का मोबाइल नंबर दर्ज करें ⚠️');
                return;
            }

            // यूनिक कस्टमर आईडी और AI अवतार जनरेट करना 🤖
            const customerId = "NSJ-" + Math.floor(10000 + Math.random() * 90000);
            const aiAvatar = `https://api.dicebear.com/7.x/avataaars/svg?seed=${number}`;

            // ब्राउज़र में डेटा सेव करना ताकि अपने आप लॉग आउट न हो 💾
            localStorage.setItem('userNumber', number);
            localStorage.setItem('customerId', customerId);
            localStorage.setItem('userAvatar', aiAvatar);

            alert('खाता सफलतापूर्वक बन गया! 🎉');
            window.location.reload(); // पेज रीफ्रेश करें ताकि अवतार और प्रोफाइल लागू हो जाए
        }

        // लॉग आउट करने का फंक्शन (जब ग्राहक खुद लॉग आउट बटन दबाएगा)
        function handleLogout() {
            localStorage.removeItem('userNumber');
            localStorage.removeItem('customerId');
            localStorage.removeItem('userAvatar');
            alert('आप सफलतापूर्वक लॉग आउट हो गए हैं! 👋');
            window.location.reload();
        }
    </script>
</body>
</html>
