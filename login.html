<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>लॉगिन - NS Jewellers</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #f9f6f0; display: flex; flex-direction: column; min-height: 100vh; padding-bottom: 80px; }
        
        .app-header { background-color: #fdfbf7; padding: 15px; border-bottom: 1px solid #e0d8c5; text-align: center; }
        .shop-name { font-size: 20px; font-weight: bold; color: #b8860b; }
        
        /* सेंटर में लॉगिन कंटेनर */
        .main-container { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; }
        .login-container { width: 100%; max-width: 400px; background: white; padding: 30px; border-radius: 12px; border: 1px solid #e0d8c5; box-shadow: 0 4px 10px rgba(0,0,0,0.05); text-align: center; }
        .login-container h2 { color: #b8860b; margin-bottom: 15px; }
        .login-container p { color: #666; font-size: 14px; margin-bottom: 20px; }
        
        .input-box { width: 100%; padding: 12px; margin-bottom: 15px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; text-align: center; }
        .login-btn { width: 100%; padding: 12px; background: #b8860b; color: white; border: none; border-radius: 6px; font-weight: bold; font-size: 16px; cursor: pointer; }
        .login-btn:hover { background: #996d08; }

        /* बॉटम नेविगेशन बार */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #fdfbf7;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #e0d8c5;
            box-shadow: 0 -2px 5px rgba(0,0,0,0.05);
            z-index: 1000;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #555; font-size: 12px; }
        .nav-icon { font-size: 18px; margin-bottom: 2px; }
        .nav-text { font-weight: 500; }
        .nav-item:hover { color: #b8860b; }
    </style>
</head>
<body>

    <header class="app-header">
        <div class="shop-name">NS Jewellers 💍</div>
    </header>

    <div class="main-container">
        <div class="login-container">
            <h2>ग्राहक खाता 👤</h2>
            <p>अपनी प्रोफाइल और इतिहास देखने के लिए मोबाइल नंबर दर्ज करें</p>
            
            <input type="tel" id="mobileNumber" class="input-box" placeholder="मोबाइल नंबर (10 अंक)" maxlength="10">
            <button class="login-btn" onclick="handleLogin()">खाता बनाएं / लॉगिन करें</button>
        </div>
    </div>

    <!-- बॉटम नेविगेशन बार -->
    <nav class="bottom-nav">
        <a href="index.html" class="nav-item">
            <span class="nav-icon">🏠</span>
            <span class="nav-text">होम</span>
        </a>
        <a href="productlist.html" class="nav-item">
            <span class="nav-icon">💍</span>
            <span class="nav-text">सूची</span>
        </a>
        <a href="history.html" class="nav-item">
            <span class="nav-icon">📜</span>
            <span class="nav-text">इतिहास</span>
        </a>
        <a href="login.html" class="nav-item" style="color: #b8860b;">
            <span class="nav-icon">👤</span>
            <span class="nav-text">लॉगिन</span>
        </a>
    </nav>

    <script>
        function handleLogin() {
            const number = document.getElementById('mobileNumber').value.trim();

            if (number.length !== 10 || isNaN(number)) {
                alert('कृपया वैध 10 अंकों का मोबाइल नंबर दर्ज करें ⚠️');
                return;
            }

            // यूनिक कस्टमर आईडी बनाना (जैसे: NSJ-54321)
            const customerId = "NSJ-" + Math.floor(10000 + Math.random() * 90000);
            
            // AI अवतार जनरेट करना
            const aiAvatar = `https://api.dicebear.com/7.x/avataaars/svg?seed=${number}`;

            // ब्राउज़र में डेटा सेव करना ताकि अपने आप लॉग आउट न हो
            localStorage.setItem('userNumber', number);
            localStorage.setItem('customerId', customerId);
            localStorage.setItem('userAvatar', aiAvatar);

            alert('खाता सफलतापूर्वक बन गया! 🎉');
            window.location.href = 'history.html';
        }
    </script>
</body>
</html>
