<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>NS Jewellers - Login</title>
    <style>
        body { font-family: sans-serif; background-color: #f9f6f0; padding: 20px; }
        .card { background: #fff; padding: 20px; border-radius: 10px; border: 1px solid #e0d8c5; max-width: 400px; margin: auto; }
        .form-input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .action-btn { width: 100%; background: #b8860b; color: white; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .link-text { text-align: center; margin-top: 15px; display: block; color: blue; text-decoration: underline; cursor: pointer; }
    </style>
</head>
<body>

<!-- लॉगिन सेक्शन -->
<div id="loginSection" class="card">
    <h2>लॉगिन करें 💍</h2>
    <input type="tel" id="loginMobile" class="form-input" placeholder="अपना 10 अंकों का मोबाइल नंबर" maxlength="10">
    <button class="action-btn" onclick="verifyLogin()">लॉगिन (OTP भेजें)</button>
    <span class="link-text" onclick="showRegister()">नया अकाउंट बनाएँ (Register)</span>
</div>

<!-- रजिस्ट्रेशन सेक्शन (Google Form Link के साथ) -->
<div id="registerSection" class="card" style="display:none;">
    <h2>नया अकाउंट बनाएँ 📝</h2>
    <p>विवरण भरने के लिए नीचे क्लिक करें:</p>
    <!-- यहाँ अपने Google Form का लिंक डालें -->
    <a href="https://forms.gle/yyes6cZKNx6Ew9Xr8" target="_blank" class="action-btn" style="text-decoration: none; text-align: center; display: block;">यहाँ अपना विवरण भरें</a>
    <span class="link-text" onclick="showLogin()">वापस लॉगिन पर जाएँ</span>
</div>

<script>
    function showRegister() {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('registerSection').style.display = 'block';
    }

    function showLogin() {
        document.getElementById('loginSection').style.display = 'block';
        document.getElementById('registerSection').style.display = 'none';
    }

    function verifyLogin() {
        const mob = document.getElementById('loginMobile').value;
        if(mob.length === 10) {
            alert("OTP आपके मोबाइल नंबर पर भेजा गया है (सिमुलेशन)।");
            // यहाँ आप भविष्य में असली OTP सर्विस जोड़ सकते हैं
        } else {
            alert("कृपया सही मोबाइल नंबर डालें!");
        }
    }
</script>
</body>
</html>
