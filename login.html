<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>NS Jewellers - सुरक्षित लॉगिन</title>
    <style>
        body { font-family: sans-serif; background-color: #f9f6f0; padding: 20px; }
        .card { background: #fff; padding: 20px; border-radius: 10px; border: 1px solid #e0d8c5; max-width: 400px; margin: auto; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .form-input { width: 100%; padding: 12px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .action-btn { width: 100%; background: #b8860b; color: white; padding: 12px; border: none; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .link-text { text-align: center; margin-top: 15px; display: block; color: blue; text-decoration: underline; cursor: pointer; }
        h2 { color: #b8860b; text-align: center; }
    </style>
</head>
<body>

<div id="loginSection" class="card">
    <h2>NS Jewellers 💍</h2>
    <input type="tel" id="loginMobile" class="form-input" placeholder="10 अंकों का मोबाइल नंबर" maxlength="10">
    <input type="password" id="loginPin" class="form-input" placeholder="4 अंकों का पिन" maxlength="4">
    <button class="action-btn" onclick="secureLogin()">लॉगिन करें</button>
    <span class="link-text" onclick="showRegister()">नया अकाउंट बनाएँ</span>
</div>

<div id="registerSection" class="card" style="display:none;">
    <h2>नया अकाउंट बनाएँ 📝</h2>
    <a href="https://forms.gle/uyspQ5etPF7bgZTMA" target="_blank" class="action-btn" style="text-decoration:none; display:block; text-align:center;">यहाँ रजिस्टर करें</a>
    <span class="link-text" onclick="showLogin()">वापस लॉगिन पर जाएँ</span>
</div>

<div id="profileSection" class="card" style="display:none;">
    <h3>👤 प्रोफाइल जानकारी</h3>
    <p><strong>नाम:</strong> <span id="dispName"></span></p>
    <p><strong>पिता का नाम:</strong> <span id="dispFather"></span></p>
    <p><strong>पता:</strong> <span id="dispAddr"></span></p>
    <button class="action-btn" onclick="location.reload()">लॉग आउट</button>
</div>

<script>
    const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw7h3Ifc9jDgqrLDxObiB94gFbQWhV6tRDv3Ax8pvfwFcCl2h8DavWwd7Bw6GvIS_s/exec";

    function showRegister() {
        document.getElementById('loginSection').style.display = 'none';
        document.getElementById('registerSection').style.display = 'block';
    }

    function showLogin() {
        document.getElementById('loginSection').style.display = 'block';
        document.getElementById('registerSection').style.display = 'none';
    }

    function secureLogin() {
        const mob = document.getElementById('loginMobile').value;
        const pin = document.getElementById('loginPin').value;

        if(mob.length !== 10 || pin.length !== 4) {
            alert("कृपया सही मोबाइल नंबर और पिन डालें!");
            return;
        }

        fetch(WEB_APP_URL, {
            method: "POST",
            body: JSON.stringify({ action: "get", mobile: mob })
        })
        .then(response => response.json())
        .then(data => {
            if(data.status === "found") {
                if(String(data.pin) === String(pin)) {
                    document.getElementById('loginSection').style.display = 'none';
                    document.getElementById('profileSection').style.display = 'block';
                    document.getElementById('dispName').innerText = data.name;
                    document.getElementById('dispFather').innerText = data.father;
                    document.getElementById('dispAddr').innerText = data.address;
                } else {
                    alert("गलत पिन!");
                }
            } else {
                alert("नंबर रजिस्टर नहीं है!");
            }
        })
        .catch(err => alert("सर्वर एरर, कृपया बाद में प्रयास करें।"));
    }
</script>
</body>
</html>
