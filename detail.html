<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>उत्पाद विवरण - NS Jewellers</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background-color: #fdfbf7; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 30px; }
        .image-section { flex: 1; min-width: 300px; }
        .main-img { width: 100%; aspect-ratio: 1/1; border-radius: 15px; object-fit: cover; border: 2px solid #e0d8c5; }
        .details-section { flex: 1; min-width: 300px; }
        .title { color: #b8860b; font-size: 28px; margin-bottom: 10px; }
        .category { color: #888; font-size: 16px; margin-bottom: 20px; }
        .desc-box { background: #fffaf0; padding: 20px; border-radius: 10px; border-left: 5px solid #b8860b; line-height: 1.6; color: #444; }
        .related-section { margin-top: 40px; width: 100%; }
        .items-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; margin-top: 20px; }
        .item-card { background: white; padding: 10px; border-radius: 10px; border: 1px solid #e0d8c5; text-align: center; cursor: pointer; }
        .item-card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="image-section">
            <img id="mainImage" class="main-img" src="" alt="Product">
        </div>
        <div class="details-section">
            <h1 id="productName" class="title"></h1>
            <p id="productCategory" class="category"></p>
            <div id="productDesc" class="desc-box"></div>
        </div>
    </div>

    <div class="related-section">
        <h2>मिलते-जुलते उत्पाद 💍</h2>
        <div class="items-grid" id="relatedGrid"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const name = urlParams.get('name');
        const cat = urlParams.get('category');
        const img = urlParams.get('image');

        document.getElementById('productName').innerText = name;
        document.getElementById('productCategory').innerText = "श्रेणी: " + cat.toUpperCase();
        document.getElementById('mainImage').src = img;

        // यूनिक और रियलिस्टिक डिस्क्रिप्शन
        const desc = {
            'ring': "यह अंगूठी आधुनिक इंजीनियरिंग और पारंपरिक कलाकारी का बेहतरीन उदाहरण है। इसे पहनने पर आपको मिलेगा एक प्रीमियम फील जो किसी भी पार्टी की जान बन सकता है।",
            'necklace': "हमारा यह हार आपके गले की शोभा बढ़ाने के लिए खास तौर पर डिज़ाइन किया गया है। इसमें बारीक मीनाकारी और शुद्ध सोने की चमक इसे सबसे अलग बनाती है।",
            'earrings': "ये झुमके हल्के वजन में भारी लुक देते हैं, जो आपको पूरे दिन बिना किसी परेशानी के स्टाइलिश दिखने में मदद करते हैं।"
        };
        document.getElementById('productDesc').innerText = desc[cat.toLowerCase()] || "यह एक प्रीमियम क्वालिटी आभूषण है जो NS Jewellers की शुद्धता के वादे के साथ आता है।";

        // RELATED PRODUCTS लोड करने के लिए API कॉल
        async function loadRelated() {
            const res = await fetch("https://script.google.com/macros/s/AKfycbwCTZUilH9wnAww-__NcGbRzTk02sQsuwEYxIWBZm6GNwz9mnU-36NASZFtXtyD4OXD/exec");
            const all = await res.json();
            const related = all.filter(item => item.category.toLowerCase() === cat.toLowerCase() && item.name !== name);
            
            const grid = document.getElementById('relatedGrid');
            related.slice(0, 4).forEach(item => {
                grid.innerHTML += `<div class="item-card" onclick="location.href='detail.html?name=${item.name}&category=${item.category}&image=${item.image}'">
                    <img src="${item.image}"><h3>${item.name}</h3>
                </div>`;
            });
        }
        loadRelated();
    </script>
</body>
</html>
