<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>उत्पाद विवरण - NS Jewellers</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #f9f6f0; padding: 20px; padding-bottom: 80px; }
        .container { max-width: 800px; margin: 0 auto; }
        .main-img { width: 100%; aspect-ratio: 1/1; border-radius: 15px; border: 1px solid #e0d8c5; object-fit: cover; }
        .thumb-container { display: flex; gap: 10px; margin: 15px 0; }
        .thumb { width: 70px; height: 70px; border-radius: 8px; border: 1px solid #b8860b; cursor: pointer; object-fit: cover; }
        .details { background: white; padding: 20px; border-radius: 15px; border: 1px solid #e0d8c5; }
        .title { color: #b8860b; font-size: 24px; margin-bottom: 5px; }
        .purity-box { margin: 20px 0; }
        .purity-btn { padding: 8px 20px; border: 1px solid #b8860b; background: none; cursor: pointer; border-radius: 5px; margin-right: 10px; }
        .active { background: #b8860b; color: white; }
        .desc-long { line-height: 1.8; color: #444; text-align: justify; }
        
        /* Bottom Nav */
        .bottom-nav { position: fixed; bottom: 0; left: 0; width: 100%; background: #fdfbf7; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid #e0d8c5; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; text-decoration: none; color: #555; font-size: 12px; }
    </style>
</head>
<body>

<div class="container">
    <img id="mainImage" class="main-img" src="">
    <div class="thumb-container" id="thumbs"></div>
    
    <div class="details">
        <h1 id="productName" class="title"></h1>
        <p id="productCategory" style="color:#888;"></p>
        
        <div class="purity-box">
            <p>शुद्धता चुनें:</p>
            <button class="purity-btn active" onclick="this.classList.add('active')">22K (916)</button>
            <button class="purity-btn" onclick="this.classList.add('active')">18K (750)</button>
        </div>

        <div id="productDesc" class="desc-long"></div>
    </div>
</div>

<!-- Bottom Navigation -->
<nav class="bottom-nav">
    <a href="index.html" class="nav-item"><span>🏠</span> होम</a>
    <a href="productlist.html" class="nav-item"><span>💍</span> सूची</a>
    <a href="history.html" class="nav-item"><span>📜</span> इतिहास</a>
    <a href="login.html" class="nav-item"><span>👤</span> लॉगिन</a>
</nav>

<script>
    const params = new URLSearchParams(window.location.search);
    document.getElementById('productName').innerText = params.get('name');
    document.getElementById('productCategory').innerText = "श्रेणी: " + params.get('category').toUpperCase();
    document.getElementById('mainImage').src = params.get('image');

    // विस्तृत भावनात्मक विवरण
    document.getElementById('productDesc').innerHTML = `
        <h3>यह आभूषण ही क्यों चुनें?</h3>
        <p>आभूषण केवल धातु नहीं, बल्कि भावनाएं हैं। ${params.get('name')} न केवल आपकी सुंदरता को निखारता है, बल्कि यह एक सुरक्षित निवेश भी है जो समय के साथ अपनी चमक और मूल्य दोनों बढ़ाता है।</p>
        <h3>कारीगरी और इतिहास</h3>
        <p>इसे तैयार करने में हमारे अनुभवी कारीगरों ने हफ़्तों का समय लिया है। प्राचीन तकनीक और आधुनिक फिनिशिंग का मिश्रण इसे एक 'मास्टरपीस' बनाता है।</p>
        <h3>महत्व</h3>
        <p>किसी भी खास मौके पर इसे पहनना आपकी पहचान को अलग बनाता है। यह आभूषण आने वाली पीढ़ियों के लिए एक अमूल्य उपहार है जो परिवार की परंपरा और प्रेम को दर्शाता है। इसे पहनना मतलब खुद को गर्व और आत्मविश्वास से सजाना है।</p>
    `;
</script>
</body>
</html>
