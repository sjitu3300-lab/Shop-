<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>उत्पाद विवरण - NS Jewellers</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #fdfbf7; padding: 20px; color: #333; }
        .container { max-width: 1000px; margin: 0 auto; display: flex; flex-wrap: wrap; gap: 40px; }
        .image-section { flex: 1; min-width: 350px; }
        .main-img { width: 100%; aspect-ratio: 1/1; border-radius: 15px; border: 2px solid #e0d8c5; object-fit: cover; }
        .thumbnail-container { display: flex; gap: 10px; margin-top: 15px; }
        .thumb-img { width: 80px; height: 80px; border-radius: 8px; border: 1px solid #e0d8c5; cursor: pointer; object-fit: cover; }
        .details-section { flex: 1; min-width: 350px; }
        .title { color: #b8860b; font-size: 32px; margin-bottom: 10px; }
        .desc-box { background: #fffaf0; padding: 25px; border-radius: 12px; border-left: 6px solid #b8860b; line-height: 1.8; font-size: 16px; }
        .related-section { margin-top: 50px; }
        .items-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-top: 20px; }
        .item-card { background: white; padding: 12px; border-radius: 10px; border: 1px solid #e0d8c5; text-align: center; cursor: pointer; }
        .item-card img { width: 100%; aspect-ratio: 1/1; object-fit: cover; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="image-section">
            <img id="mainImage" class="main-img" src="" alt="Main Product">
            <div class="thumbnail-container" id="thumbs"></div>
        </div>
        <div class="details-section">
            <h1 id="productName" class="title"></h1>
            <p id="productCategory" style="color:#b8860b; font-weight:bold;"></p>
            <div id="productDesc" class="desc-box"></div>
        </div>
    </div>

    <div class="related-section">
        <h2>मिलते-जुलते उत्पाद 💍</h2>
        <div class="items-grid" id="relatedGrid"></div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const name = urlParams.get('name');
        const cat = urlParams.get('category');
        const img1 = urlParams.get('image');
        // बाकी 3 इमेज भी URL से लेंगे
        const img2 = urlParams.get('img2');
        const img3 = urlParams.get('img3');
        const img4 = urlParams.get('img4');

        document.getElementById('productName').innerText = name;
        document.getElementById('productCategory').innerText = "श्रेणी: " + cat.toUpperCase();
        document.getElementById('mainImage').src = img1;

        // थंबनेल सेट करना
        const thumbs = document.getElementById('thumbs');
        [img1, img2, img3, img4].forEach(src => {
            if(src) thumbs.innerHTML += `<img class="thumb-img" src="${src}" onclick="document.getElementById('mainImage').src='${src}'">`;
        });

        // विस्तृत विवरण (History & Making Process)
        const longDesc = `
            <h3>हमारी कलाकारी का इतिहास</h3>
            <p>NS Jewellers में, हम आभूषण नहीं, बल्कि एक विरासत बनाते हैं। ${name} का यह डिज़ाइन हमारे पूर्वजों द्वारा अपनाई गई पारंपरिक तकनीकों और आधुनिक बारीकियों का संगम है।</p>
            <h3>निर्माण प्रक्रिया (Making Process)</h3>
            <p>इस अद्भुत आभूषण को बनाने में 15 से अधिक कारीगरों की कड़ी मेहनत शामिल है। पहले शुद्ध सोने को पिघलाकर सांचे में ढाला जाता है, फिर बारीक हथौड़ों से आकार दिया जाता है। अंत में, कुशल कारीगरों द्वारा की गई नक्काशी इसे एक जीवंत रूप देती है। हम शुद्धता की गारंटी के लिए हॉलमार्क का उपयोग करते हैं, ताकि यह आभूषण पीढ़ियों तक अपनी चमक बनाए रखे।</p>
        `;
        document.getElementById('productDesc').innerHTML = longDesc;

        // RELATED PRODUCTS - यहाँ Fetch कॉल करें
        async function loadRelated() {
            const res = await fetch("https://script.google.com/macros/s/AKfycbwCTZUilH9wnAww-__NcGbRzTk02sQsuwEYxIWBZm6GNwz9mnU-36NASZFtXtyD4OXD/exec");
            const all = await res.json();
            const related = all.filter(item => item.category.toLowerCase() === cat.toLowerCase() && item.name !== name);
            const grid = document.getElementById('relatedGrid');
            related.slice(0, 4).forEach(item => {
                grid.innerHTML += `<div class="item-card" onclick="location.href='detail.html?name=${item.name}&category=${item.category}&image=${item.image}'">
                    <img src="${item.image}"><h4>${item.name}</h4>
                </div>`;
            });
        }
        loadRelated();
    </script>
</body>
</html>
